[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=www-data:www-data

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ==========================================
# ВОРКЕРЫ ДЛЯ КАЖДОГО САЙТА
# ==========================================

[program:worker-starscy]
command=php /var/www/html/sites/starscy.ru/artisan queue:work redis --queue=starscy,emails,notifications --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html/sites/starscy.ru
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-starscy.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:worker-wedding]
command=php /var/www/html/sites/wedding.starscy.ru/artisan queue:work redis --queue=wedding --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html/sites/wedding.starscy.ru
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-wedding.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

