services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi_app
    restart: unless-stopped
    volumes:
      - ./sites:/var/www/html/sites
      - ./docker/nginx:/etc/nginx/conf.d
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./docker/entrypoint.sh:/entrypoint.sh
    ports:
      - "127.0.0.1:8000:80"
    entrypoint: ["/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:15-alpine
    container_name: multi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: multi_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi_worker
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    volumes:
      - ./sites:/var/www/html/sites
      - ./docker/supervisord-worker.conf:/etc/supervisor/conf.d/supervisord.conf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    command:
      - "supervisord -c /etc/supervisor/conf.d/supervisord.conf"
    deploy:
      resources:
        limits:
          memory: 512M

  # ==========================================
  # 🆕 UPTIME KUMA — мониторинг
  # ==========================================
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: multi_uptime
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  uptime_data:
